name: Build JARVIS 15 S26

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-150-s26-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Fetch private JARVIS 15 source bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf JARVIS
          mkdir -p JARVIS
          for i in 1 2 3 4 5 6 7; do
            curl -fL --retry 3 --retry-delay 2               "https://hlrduovwbahcnqguqitw.supabase.co/functions/v1/jarvis-build-150-g${i}"               -o "/tmp/jarvis-g${i}.json"
          done
          python3 - <<'PY'
          import json, base64
          from pathlib import Path
          root=Path("JARVIS")
          count=0
          for i in range(1,8):
              data=json.loads(Path(f"/tmp/jarvis-g{i}.json").read_text())
              for item in data["files"]:
                  p=root/item["path"]
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(base64.b64decode(item["data"]))
                  count += 1
          print("Imported files:", count)
          assert count == 78, count
          PY
          grep -n 'versionName "15.0.0"' JARVIS/app/build.gradle
          grep -n 'compileSdk 36' JARVIS/app/build.gradle
          grep -n 'targetSdk 36' JARVIS/app/build.gradle

      - name: Apply S26 voice continuity fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Version bump for the corrected S26 build.
          gradle = Path("JARVIS/app/build.gradle")
          g = gradle.read_text()
          g = g.replace('versionCode 150', 'versionCode 151')
          g = g.replace('versionName "15.0.0"', 'versionName "15.0.1"')
          gradle.write_text(g)

          # Prefer offline Android TTS voices when cloud speech falls back locally.
          voice = Path("JARVIS/app/src/main/java/de/jarvis/mobile/CloudVoicePlayer.java")
          v = voice.read_text()
          old = '''                if(n.contains("premium")||n.contains("enhanced")||n.contains("neural")||n.contains("wavenet")||n.contains("natural"))score+=750;
                if(n.contains("network"))score+=520;
                if(n.contains("male")||n.contains("mann")||n.contains("männ")||n.contains("mascul"))score+=300;
                if(n.contains("de-de-x-deb")||n.contains("de-de-x-deg"))score+=180;
                if(n.contains("nfh")||n.contains("low"))score-=500;
                if(!v.isNetworkConnectionRequired())score+=60;'''
          new = '''                if(n.contains("premium")||n.contains("enhanced")||n.contains("neural")||n.contains("wavenet")||n.contains("natural"))score+=500;
                if(n.contains("male")||n.contains("mann")||n.contains("männ")||n.contains("mascul"))score+=300;
                if(n.contains("de-de-x-deb")||n.contains("de-de-x-deg"))score+=180;
                if(n.contains("nfh")||n.contains("low"))score-=500;
                // Reliability first on Samsung/Android 16: avoid voices that must stream while speaking.
                if(v.isNetworkConnectionRequired()||n.contains("network"))score-=1200;
                else score+=900;'''
          if old not in v:
              raise SystemExit("CloudVoicePlayer patch target missing")
          voice.write_text(v.replace(old,new))

          # Do not start cloud audio until the WebView believes the whole utterance can play through.
          svc = Path("JARVIS/app/src/main/java/de/jarvis/mobile/PuterCloudService.java")
          p = svc.read_text()
          old = '''+"window.jarvisSpeak=async function(id,text){const myGen=++jarvisVoiceGen;try{if(!puter.auth.isSignedIn()){AndroidJarvis.ttsFail(id,'AUTH_REQUIRED');return;}if(jarvisAudio){try{jarvisAudio.pause();jarvisAudio.currentTime=0;}catch(e){}jarvisAudio=null;}const audio=await puter.ai.txt2speech(text,{provider:'xai',voice:'leo',language:'auto',output_format:'mp3'});if(myGen!==jarvisVoiceGen){AndroidJarvis.ttsFail(id,'CANCELLED');return;}jarvisAudio=audio;audio.onplay=()=>AndroidJarvis.ttsStart(id);audio.onended=()=>{if(myGen===jarvisVoiceGen){jarvisAudio=null;AndroidJarvis.ttsDone(id)}};audio.onerror=()=>{if(myGen===jarvisVoiceGen){jarvisAudio=null;AndroidJarvis.ttsFail(id,'TTS_PLAYBACK')}};await audio.play();}catch(e){if(myGen===jarvisVoiceGen)AndroidJarvis.ttsFail(id,(e&&e.message)?e.message:String(e));}};"'''
          new = '''+"window.jarvisSpeak=async function(id,text){const myGen=++jarvisVoiceGen;try{if(!puter.auth.isSignedIn()){AndroidJarvis.ttsFail(id,'AUTH_REQUIRED');return;}if(jarvisAudio){try{jarvisAudio.pause();jarvisAudio.currentTime=0;}catch(e){}jarvisAudio=null;}const audio=await puter.ai.txt2speech(text,{provider:'xai',voice:'leo',language:'auto',output_format:'mp3'});if(myGen!==jarvisVoiceGen){AndroidJarvis.ttsFail(id,'CANCELLED');return;}jarvisAudio=audio;try{audio.preload='auto';}catch(e){};const buffered=await new Promise(resolve=>{if(audio.readyState>=4){resolve(true);return;}let done=false;const ok=()=>{if(done)return;done=true;resolve(true)};const bad=()=>{if(done)return;done=true;resolve(false)};try{audio.addEventListener('canplaythrough',ok,{once:true});audio.addEventListener('error',bad,{once:true});audio.load&&audio.load();}catch(e){}setTimeout(bad,6500)});if(myGen!==jarvisVoiceGen){AndroidJarvis.ttsFail(id,'CANCELLED');return;}if(!buffered){jarvisAudio=null;AndroidJarvis.ttsFail(id,'TTS_BUFFER_TIMEOUT');return;}audio.onplay=()=>AndroidJarvis.ttsStart(id);audio.onended=()=>{if(myGen===jarvisVoiceGen){jarvisAudio=null;AndroidJarvis.ttsDone(id)}};audio.onerror=()=>{if(myGen===jarvisVoiceGen){jarvisAudio=null;AndroidJarvis.ttsFail(id,'TTS_PLAYBACK')}};await audio.play();}catch(e){if(myGen===jarvisVoiceGen)AndroidJarvis.ttsFail(id,(e&&e.message)?e.message:String(e));}};"'''
          if old not in p:
              raise SystemExit("PuterCloudService patch target missing")
          svc.write_text(p.replace(old,new))
          PY
          grep -n 'versionName "15.0.1"' JARVIS/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android API 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and AAB
        working-directory: JARVIS
        run: gradle :app:assembleDebug :app:bundleDebug --stacktrace

      - name: Prepare JARVIS 15 files
        run: |
          cp JARVIS/app/build/outputs/apk/debug/app-debug.apk JARVIS-15-S26-debug.apk
          cp JARVIS/app/build/outputs/bundle/debug/app-debug.aab JARVIS-15-S26-debug.aab
          sha256sum JARVIS-15-S26-debug.apk JARVIS-15-S26-debug.aab > JARVIS-15-S26-SHA256SUMS.txt
          ls -lh JARVIS-15-S26-debug.apk JARVIS-15-S26-debug.aab JARVIS-15-S26-SHA256SUMS.txt

      - name: Upload JARVIS 15 artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-15-S26-package
          path: |
            JARVIS-15-S26-debug.apk
            JARVIS-15-S26-debug.aab
            JARVIS-15-S26-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish JARVIS 15 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view jarvis-15-s26-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload jarvis-15-s26-build JARVIS-15-S26-debug.apk JARVIS-15-S26-debug.aab JARVIS-15-S26-SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create jarvis-15-s26-build JARVIS-15-S26-debug.apk JARVIS-15-S26-debug.aab JARVIS-15-S26-SHA256SUMS.txt               --repo "$GITHUB_REPOSITORY" --target main               --title "JARVIS Android 15 S26"               --notes "JARVIS 15.0.0 S26/Life OS debug APK and AAB."
          fi
